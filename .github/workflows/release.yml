name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Detect new version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      should_release: ${{ steps.version.outputs.should_release }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read package version
        id: version
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          package_version() {
            awk -F '"' '
              /^\[package\]$/ { in_package = 1; next }
              in_package && /^\[/ { exit }
              in_package && /^version = "/ { print $2; exit }
            '
          }

          version=$(package_version < Cargo.toml)
          if [[ -z "$version" ]]; then
            echo "Could not read the package version from Cargo.toml" >&2
            exit 1
          fi

          previous_version=""
          if [[ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]] &&
             git cat-file -e "$BEFORE_SHA:Cargo.toml" 2>/dev/null; then
            previous_version=$(git show "$BEFORE_SHA:Cargo.toml" | package_version)
          fi

          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          if [[ "$version" == "$previous_version" ]]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Package version is still $version; nothing to release."
          elif git rev-parse "refs/tags/$tag" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "$tag already exists; nothing to release."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Package version changed from ${previous_version:-<none>} to $version; preparing $tag."
          fi

  verify:
    name: Test release
    needs: version
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Verify lockfile
        run: cargo metadata --locked --no-deps > /dev/null

      - name: Run tests
        run: cargo test --all-features --locked

  build:
    name: Build ${{ matrix.target }}
    needs: [version, verify]
    if: needs.version.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: aarch64-apple-darwin
            os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@cross

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        shell: bash
        run: |
          if [[ "${{ matrix.cross }}" == "true" ]]; then
            cross build --release --locked --target "${{ matrix.target }}"
          else
            cargo build --release --locked --target "${{ matrix.target }}"
          fi

      - name: Package release archive
        shell: bash
        run: |
          archive="epg-${{ needs.version.outputs.version }}-${{ matrix.target }}.tar.gz"
          tar -C "target/${{ matrix.target }}/release" -czf "$archive" epg
          shasum -a 256 "$archive" > "$archive.sha256"

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: epg-${{ matrix.target }}
          path: |
            epg-*.tar.gz
            epg-*.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Publish release
    needs: [version, build]
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release create "$TAG" artifacts/* \
            --target "$GITHUB_SHA" \
            --generate-notes \
            --title "$TAG"

[package]
name = "epg-viewer"
version = "0.1.0"
edition = "2021"
description = "A TUI EPG (XMLTV) viewer with SQLite caching and vim-style bindings"
authors = ["jamwil"]
license = "MIT"

[[bin]]
name = "epg"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
quick-xml = "0.36"
rusqlite = { version = "0.32", features = ["bundled"] }
ureq = "2.12"
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1"
chrono = "0.4"
unicode-width = "0.2"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
